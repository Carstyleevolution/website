name: Pubblica sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Genera il sito
        run: python build.py

      - name: Prepara i file pubblici
        run: |
          mkdir -p _site
          cp -- *.html robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
